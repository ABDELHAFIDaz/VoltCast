[project]
name = "voltcast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abd_Elhafid", email = "200634294+ABDELHAFIDaz@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[project.scripts]
voltcast = "voltcast:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbstripout>=0.9.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
